<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In - Fintrack Smart Expense Tracker</title>
    <meta name="description" content="Sign in to your Fintrack account to access your personal finance dashboard, budgets, statement imports, and AI insights." />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="ambient-glow ambient-glow-1"></div>
    <div class="ambient-glow ambient-glow-2"></div>

    <div class="auth-wrapper">
        <div class="auth-card">
            <!-- Brand -->
            <a href="index.html" class="brand-logo">
                <div class="brand-icon">
                    <i class="fa-solid fa-wallet"></i>
                </div>
                <span class="brand-name">Fintrack</span>
            </a>

            <div class="auth-header">
                <h2>Welcome Back</h2>
                <p>Sign in to access your financial dashboard and insights</p>
            </div>

            <!-- Already Signed In Notice (if user has active session) -->
            <div class="auth-info-banner d-none" id="alreadyLoggedInBanner"></div>

            <!-- Error Banner -->
            <div class="error-banner" id="errorBanner">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="errorText">Please check your details</span>
            </div>

            <!-- Login Form -->
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-with-icon">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="email" placeholder="alex@example.com" required autocomplete="email" />
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
                        <i class="fa-regular fa-eye password-toggle"></i>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block-auth" id="loginSubmitBtn">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Dashboard
                </button>
            </form>

            <p class="auth-footer-text">
                Don't have an account? <a href="signup.html" class="auth-link">Create Free Account</a>
            </p>

            <div class="auth-card-subfooter">
                <a href="index.html" class="auth-back-link"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
