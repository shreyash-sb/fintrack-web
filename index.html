<!doctype html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Fintrack Smart Expense Tracker</title>
    <meta name="description" content="Manage your personal finances, track daily expenses, and achieve savings goals with Fintrack." />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="ambient-glow ambient-glow-1"></div>
    <div class="ambient-glow ambient-glow-2"></div>

    <div class="auth-wrapper">
        <div class="auth-card">
            <!-- Brand -->
            <div class="brand-logo">
                <div class="brand-icon">
                    <i class="fa-solid fa-wallet"></i>
                </div>
                <span class="brand-name">Fintrack</span>
            </div>

            <div class="auth-header">
                <h2>Welcome Back</h2>
                <p>Sign in to manage your budget & cashflow</p>
            </div>

            <!-- Error Banner -->
            <div class="error-banner" id="errorBanner">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="errorText">Invalid credentials</span>
            </div>

            <!-- Login Form -->
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-with-icon">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="email" placeholder="alex@example.com" required autocomplete="email" />
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
                        <i class="fa-regular fa-eye password-toggle"></i>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 14px;">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In
                </button>
            </form>

            <p style="font-size: 14px; color: var(--text-secondary); margin-top: 20px;">
                Don't have an account? <a href="signup.html" style="font-weight: 600;">Create Account</a>
            </p>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
